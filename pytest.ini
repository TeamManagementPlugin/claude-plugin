[pytest]
# Pin collection to the first-party suite under test/. Without this, a bare
# `pytest` from the repo root also collects stray test_*.py files elsewhere in
# the tree (e.g. the retired plugin/mcp/test_server.py, whose (env, results)
# signatures pytest read as missing fixtures -> 11 guaranteed collection ERRORS).
# All first-party tests live in test/ (m-statusline-and-test-infra, SC#3).
testpaths = test
